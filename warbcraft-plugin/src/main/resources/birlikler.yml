# skin: askerlerin görünüşü. İki yol var:
#   skin: {oyuncu: <Minecraft kullanıcı adı>}            o oyuncunun skini kullanılır
#   skin: {doku: <value>, imza: <signature>}             mineskin.org'da yükleyip aldığın değerler
# Boş bırakılırsa varsayılan Steve/Alex görünür.
kulturler:
  valdor:  # batılı şövalyeler ve arbaletçiler
